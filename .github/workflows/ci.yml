name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WebFEB/WebFEB.sln

      - name: Build
        run: dotnet build WebFEB/WebFEB.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WebFEB/WebFEB.sln --configuration Release --no-build --verbosity normal
