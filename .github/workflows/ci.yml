name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore WebFEBTests/WebFEBTests.csproj

      - name: Build
        run: dotnet build WebFEBTests/WebFEBTests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test WebFEBTests/WebFEBTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Audit application dependencies
        run: dotnet list WebFEB/WebFEB.csproj package --vulnerable --include-transitive

      - name: Audit test dependencies
        run: dotnet list WebFEBTests/WebFEBTests.csproj package --vulnerable --include-transitive
